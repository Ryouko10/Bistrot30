<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Mia Attività</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #eee;
    }
    header {
      background-color: #111;
      padding: 20px;
      text-align: center;
      color: #d4af37;
    }
    nav {
      display: flex;
      justify-content: center;
      background-color: #222;
    }
    nav a {
      color: #d4af37;
      padding: 14px 20px;
      text-decoration: none;
      text-transform: uppercase;
    }
    nav a:hover {
      background-color: #0a0;
      color: #000;
    }
    section {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }
    h2 {
      color: #0f0;
      text-align: center;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border: 3px solid #d4af37;
    }
    .contact, .map {
      background-color: #111;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }
    footer {
      background-color: #000;
      text-align: center;
      color: #888;
      padding: 20px;
    }
    .social a {
      margin: 0 10px;
      color: #d4af37;
      text-decoration: none;
      font-size: 1.5em;
    }
  </style>
</head>
<body>

  <header>
    <h1>Benvenuti alla Nostra Attività</h1>
    <p>Qualità, stile e professionalità</p>
  </header>

  <nav>
    <a href="#galleria">Galleria</a>
    <a href="#contatti">Contatti</a>
    <a href="#mappa">Dove Siamo</a>
  </nav>

  <section id="galleria">
    <h2>Galleria</h2>
    <div class="gallery">
      <img src="https://via.placeholder.com/400x300?text=Foto+1" alt="Foto 1">
      <img src="https://via.placeholder.com/400x300?text=Foto+2" alt="Foto 2">
      <img src="https://via.placeholder.com/400x300?text=Foto+3" alt="Foto 3">
      <img src="https://via.placeholder.com/400x300?text=Foto+4" alt="Foto 4">
    </div>
  </section>

  <section id="contatti">
    <h2>Contatti</h2>
    <div class="contact">
      <p>Email: <a href="mailto:info@attivita.it" style="color:#0f0;">info@attivita.it</a></p>
      <p>Telefono: <a href="tel:+391234567890" style="color:#0f0;">+39 123 456 7890</a></p>
      <div class="social">
        <a href="https://facebook.com" target="_blank">Facebook</a>
        <a href="https://instagram.com" target="_blank">Instagram</a>
        <a href="https://wa.me/391234567890" target="_blank">WhatsApp</a>
      </div>
    </div>
  </section>

  <section id="mappa">
    <h2>Dove Siamo</h2>
    <div class="map">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2889.4712562080925!2d9.189982015621238!3d45.46420397910085!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDXCsDI3JzUwLjIiTiA5wrAxMicyLjkiRQ!5e0!3m2!1sit!2sit!4v1622203095091!5m2!1sit!2sit"
        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 La Mia Attività - Tutti i diritti riservati</p>
  </footer>

</body>
</html>
